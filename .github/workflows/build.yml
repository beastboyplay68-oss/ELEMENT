name: Build ElementsSMP

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
      - name: Build
        working-directory: ElementsSMP
        run: mvn -B clean package
      - uses: actions/upload-artifact@v4
        with:
          name: ElementsSMP-jar
          path: ElementsSMP/target/ElementsSMP-1.0.0.jar
